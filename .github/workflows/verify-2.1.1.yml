name: Verify 2.1.1 fix

on:
  push:
    branches:
      - fix/supervisor-api-cache-2.1.1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r argon-one-v5-oled/requirements.txt pillow
      - name: Run existing unit test suite
        working-directory: argon-one-v5-oled
        run: python -m unittest discover -s tests -v
